        stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Side chain atoms -->
  <circle cx="21" cy="50" r="3.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="39" cy="46" r="3.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="57" cy="42" r="3.5" fill="#d1d5db" stroke="#9ca3af" stroke-width="1.5"/>

