server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # Relative redirects, so they keep the host port (8090 -> 80 mapping, Apache).
    absolute_redirect off;

    client_max_body_size 50m;

    # Proxy API calls, handling an optional single-segment base-path prefix
    # e.g. /api/... or /dezyme/api/...
    location ~ ^(/[^/]+)?/api/ {
        rewrite ^(?:/[^/]+)?(/api/.*)$ $1 break;
        proxy_pass http://backend:8000;
    }

    location = / {
        return 302 /dezyme/;
    }

    # SPA fallback (adapter-static writes it as 404.html).
    location /dezyme/ {
        try_files $uri $uri/ /dezyme/404.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
